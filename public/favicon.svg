<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" role="img" aria-label="Êzîdî-Wissensportal">
  <title>Êzîdî-Wissensportal</title>
  <!--
    Zirkumflex über drei Steinschichten: das diakritische Zeichen der
    Kurmancî-Orthografie über einer abstrahierten Schichtung.
    Bewusst kein religiöses Symbol.
  -->
  <rect width="34" height="34" rx="3" fill="#f6f2ea"/>
  <path d="M10 13.4 17 8l7 5.4" fill="none" stroke="#6b470d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#1f1b16" stroke-width="1.9" stroke-linecap="round">
    <line x1="8" y1="19" x2="26" y2="19"/>
    <line x1="8" y1="22.6" x2="22.5" y2="22.6"/>
    <line x1="8" y1="26.2" x2="18" y2="26.2"/>
  </g>
</svg>
