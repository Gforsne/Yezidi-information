  datum: '14. August 2007'
  jahr: 2007
  jahrBis: null
  datierungUnsicher: false
  epoche: nach-2003
  thema: [verfolgung]
  firman: true
  zusammenfassung: >-
    Vier mutmaßlich von al-Qaida verübte Bombenanschläge treffen die in der
    Region Şingal liegenden Dörfer al-Qahtaniya und al-Adnaniya. Die
    Opferzahlen gehen auseinander: mehr als 500 Getötete und 1.500 Verletzte
    nach Tagay/Ortaç, mehr als 700 Getötete nach der bpb. Keine der beiden
    Quellen legt ihre Erhebung offen.
