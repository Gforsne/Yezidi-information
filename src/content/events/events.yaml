  jahrBis: null
  datierungUnsicher: false
  epoche: weltkriege
  thema: [verfolgung, migration]
  firman: false
  zusammenfassung: >-
    Wegen anhaltender Verfolgung fliehen ab den 1830er Jahren mehrere
    zehntausend Êzîdî nach Armenien und Georgien. Im Februar 1918 wird eine
    türkische Heeresabteilung ausgesandt, um die Weigerung zu bestrafen, die
