- id: singal-august-2014
  title: 'Angriff des sogenannten Islamischen Staates auf Şingal'
  datum: '3. August 2014'
  jahr: 2014
  jahrBis: null
  datierungUnsicher: false
  epoche: genozid-2014
  thema: [verfolgung, recht]
  firman: true
  zusammenfassung: >-
    Der sogenannte Islamische Staat überfällt die Siedlungsgebiete in Şingal.
    Nach dem Angriff verbleiben laut UN-Untersuchungskommission keine freien
    Êzîdî in der Region; die dort lebende Gemeinschaft von 400.000 Menschen
    ist vollständig vertrieben, verschleppt oder getötet. Der Bereich Genozid
    ist noch nicht recherchiert – dieser Eintrag gibt nur wieder, was in den
    bereits geprüften Quellen steht.
  ort: 'Şingal (Sindschar)'
  artikel: 'genozid/vorgeschichte-und-chronologie-august-2014'
