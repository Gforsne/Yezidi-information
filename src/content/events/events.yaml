- id: arabisierung-1965-1987
  title: 'Arabisierung und Zwangsumsiedlung in Kollektivdörfer'
  datum: '1965, 1973–1975 und 1986–1987'
  jahr: 1965
  jahrBis: 1987
  datierungUnsicher: false
  epoche: baath
  thema: [verfolgung, migration, politik]
  firman: false
  zusammenfassung: >-
    Şingal wird in mehreren Wellen entvölkert: Die Bewohnerinnen und Bewohner
    von etwa 400 êzîdîschen Dörfern müssen in Kollektivdörfer (mujammaʽāt)
    umziehen, in ihren Dörfern werden Araber angesiedelt. Şêxan wird 1975 in
    gleicher Weise „arabisiert“. Die êzîdîsche Minderheit wird nach Dulz vor
    allem wegen ihrer Zuordnung als ethnische Kurden verfolgt und fällt den
    Anfāl-Feldzügen zum Opfer.
  ort: 'Şingal, Şêxan'
  artikel: 'geschichte/baath-zeit-arabisierung-und-umsiedlung'
  sources:
