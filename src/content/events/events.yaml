  datum: '13. bis 15. Jahrhundert'
  jahr: 1250
  jahrBis: 1500
  datierungUnsicher: true
  epoche: mittelalter
  thema: [verfolgung, gesellschaft]
  firman: false
  zusammenfassung: >-
    Ab dem 13. Jahrhundert kommt es zu schwerwiegenden Konflikten mit den
    benachbarten muslimischen Gemeinschaften, die spätestens im
    15. Jahrhundert in eine dauerhafte Trennung münden. Die Darstellung
