- id: schaikh-adi-12-jh
  title: 'Wirken des Şêx Adî ibn Musafir in Laliş'
  datum: 'um 1111 bis um 1162'
  jahr: 1111
  jahrBis: 1162
  datierungUnsicher: true
  epoche: mittelalter
  thema: [religion, gesellschaft]
  firman: false
  zusammenfassung: >-
    Şêx Adî lässt sich um 1111 mit seinen Schülern in den kurdischen Bergen
    nieder und gründet in Laliş den Adawiya-Orden. Die Forschung hält ihn für
    identisch mit dem Sufi-Gelehrten Adî bin Musafir al-Hakkari; von
    êzîdîscher Seite wird diese Zuordnung zurückgewiesen. Mit ihm setzt die
    schriftliche Überlieferung über die Gemeinschaft ein.
  ort: 'Laliş'
  artikel: 'geschichte/sex-adi-und-die-adawiyya'
  sources:
    - id: tagay-ortac-2016
      loc: 'S. 44–47'
  confidence: umstritten
  status: belegt
  contentWarning: false

- id: trennung-13-15-jh
