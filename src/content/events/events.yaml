  thema: [recht]
  firman: false
  zusammenfassung: >-
    Die Independent International Commission of Inquiry on the Syrian Arab
    Republic legt den Bericht „They came to destroy“ vor und stellt fest,
    dass der IS an den Êzîdî den Tatbestand des Völkermordes verwirklicht
