- id: feldzug-bedirxan-1832
  title: 'Feldzug Bedirxan Begs gegen Şêxan'
  datum: '1832'
  jahr: 1832
  jahrBis: null
  datierungUnsicher: false
  epoche: 19-jahrhundert
  thema: [verfolgung]
  firman: true
  zusammenfassung: >-
    Soldaten Bedirxan Begs, des Emirs von Botan, dringen in Şêxan ein. Wer
    fliehen konnte, wird vor Mosul vom ansteigenden Tigris aufgehalten; etwa
    12.000 am Ufer Zurückgebliebene werden getötet. Der Mîr Ali Beg wird nach
    Rewandûz gebracht und dort zu Tode gefoltert, weil er die Konversion
    verweigert. Die Zahl stammt aus Berichten des 19. Jahrhunderts, deren
    Erhebungsgrundlage nicht bekannt ist.
  ort: 'Şêxan, Mosul, Rewandûz'
  artikel: 'geschichte/19-jahrhundert-feldzuege'
  sources:
    - id: tagay-ortac-2016
      loc: 'S. 50'
  confidence: unklar
  status: belegt
  contentWarning: true

- id: massaker-hafiz-pasha-1837
  title: 'Massaker Hafiz Pashas in Şingal'
  datum: '1837 bis 1838'
  jahr: 1837
  jahrBis: 1838
  datierungUnsicher: false
  epoche: 19-jahrhundert
  thema: [verfolgung]
  firman: true
  zusammenfassung: >-
    Der Gouverneur von Diyarbakır richtet eine Serie von Massakern unter den
    Êzîdî in Şingal an. Helmuth von Moltke, damals militärischer Berater des
    Sultans, berichtet in seinen Briefen davon. Layard gibt an, die êzîdîsche
    Bevölkerung Şingals sei zwischen 1832 und 1838 um drei Viertel verringert
    worden – eine Angabe ohne bekannte Erhebungsgrundlage.
  ort: 'Şingal'
  artikel: 'geschichte/19-jahrhundert-feldzuege'
  sources:
