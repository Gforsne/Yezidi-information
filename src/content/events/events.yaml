- id: bundestag-anerkennung-2023
  title: 'Der Deutsche Bundestag erkennt den Völkermord an'
  datum: 'Januar 2023'
  jahr: 2023
  jahrBis: null
  datierungUnsicher: true
  epoche: gegenwart
  thema: [recht, politik]
  firman: false
  zusammenfassung: >-
    Der Deutsche Bundestag erkennt die Verbrechen des sogenannten Islamischen
    Staates an der êzîdîschen Gemeinschaft als Völkermord an und folgt dabei
    der rechtlichen Bewertung des UN-Sonderermittlungsteams UNITAD. Der
    Antrag datiert vom 18. Januar 2023; die bpb nennt Januar 2023 als
    Zeitpunkt der Anerkennung. Das genaue Beschlussdatum ist der Redaktion
    noch nicht am Plenarprotokoll geprüft.
