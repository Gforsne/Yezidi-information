  jahrBis: null
  datierungUnsicher: false
  epoche: 19-jahrhundert
  thema: [verfolgung, religion]
  firman: true
  zusammenfassung: >-
    General Omar Vahbi Pasha stellt dem Mîr die Wahl zwischen Vernichtung und
    der Annahme einer vom Koran erlaubten Religion. Nach der Ablehnung dringt
    er in Şingal und Şêxan ein. Berichtet werden 14.000 Zwangskonversionen;
