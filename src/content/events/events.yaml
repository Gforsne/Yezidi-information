- id: safawiden-osmanen-16-17-jh
  title: 'Zwischen Safawiden und Osmanen: Rückgang der êzîdîschen Stämme'
  datum: '16. und 17. Jahrhundert'
  jahr: 1501
  jahrBis: 1700
  datierungUnsicher: true
  epoche: fruehe-neuzeit
  thema: [verfolgung, politik]
  firman: false
  zusammenfassung: >-
    Die Êzîdî geraten in den Sog der Auseinandersetzung zwischen dem
    safawidischen und dem osmanischen Reich; osmanische Verwaltungsreformen
    drängen die Autonomie lokaler Stämme zurück. Viele Stämme konvertieren
    unter wirtschaftlichem und politischem Druck, die einstige
    Vormachtstellung um Şêxan und Şingal geht verloren.
  ort: 'Şêxan, Şingal'
  artikel: 'geschichte/mittelalter-und-fruehe-neuzeit'
  sources:
