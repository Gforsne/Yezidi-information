# Gegenstand der Darstellung, NICHT Beleg über die Êzîdî
# ---------------------------------------------------------------------
# Diese Titel sind im Volltext geprüft, aber sie belegen nichts darüber,
# was Êzîdî glauben, tun oder sind. Sie belegen ausschließlich, dass eine
# bestimmte Zuschreibung an einem bestimmten Ort zu einem bestimmten
